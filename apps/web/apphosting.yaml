# Firebase App Hosting config for backend "nsw-web" (europe-west4).
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  # One always-warm instance: avoids cold starts (FCP budget) and keeps
  # Next's per-instance cache consistent for on-demand revalidation.
  minInstances: 1
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Flip to "true" at DNS cutover; until then every page is noindex.
  - variable: SITE_INDEXABLE
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  # Guards the one-time WordPress import endpoints (/api/import/*).
  - variable: IMPORT_TOKEN
    secret: IMPORT_TOKEN
    availability:
      - RUNTIME
  # Bootstrap admins for /admin (comma separated); others live in Firestore users/.
  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS
    availability:
      - RUNTIME
  # Guards /api/cron/ (Cloud Scheduler job web-scheduled-publish).
  - variable: CRON_TOKEN
    secret: CRON_TOKEN
    availability:
      - RUNTIME
  # Admin sign-in mail (lib/admin/login-mail.ts). "unset" = Firebase sends the email instead.
  # Set with: gcloud secrets versions add SMTP_URL --data-file=- (smtps://user:pass@host:465)
  - variable: SMTP_URL
    secret: SMTP_URL
    availability:
      - RUNTIME
  - variable: SMTP_FROM
    value: "Dansklubben Nackswinget <noreply@nackswinget.se>"
    availability:
      - RUNTIME
